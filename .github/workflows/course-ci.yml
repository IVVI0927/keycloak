name: Course CI (Build + Unit Tests)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      
      - name: Show tool versions
        run: |
          java -version
          ./mvnw -v

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build required local dependencies (skip tests)
        run: |
          ./mvnw -pl testsuite/model -am -DskipTests install

      - name: Run tests for testsuite/model (includes our added tests)
        run: |
          ./mvnw -pl testsuite/model -Pjpa test